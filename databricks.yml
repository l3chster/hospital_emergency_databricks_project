bundle:
  name: hospital_emergency_databricks

include:
  - resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog for bronze/silver/gold tables
    default: dbr_dev
  zerobus_workspace_id:
    description: Numeric workspace id in the Zerobus ingest hostname
  zerobus_region:
    description: Azure region segment in the Zerobus ingest hostname
    default: eastus
  csv_api_app_name:
    description: Databricks App name that streams CSV rows
    default: csv-api-app
  csv_api_app_url:
    description: Full /api/stream URL of the CSV app
    default: "https://${var.csv_api_app_name}-${var.zerobus_workspace_id}.0.azure.databricksapps.com/api/stream"

targets:
  dev:
    default: true
    mode: development
    workspace:      
    variables:
      csv_api_app_url: "https://${var.csv_api_app_name}-${var.zerobus_workspace_id}.0.azure.databricksapps.com/api/stream"

  prod:
    mode: production
    workspace:      
    variables:      
      csv_api_app_url: "https://${var.csv_api_app_name}-${var.zerobus_workspace_id}.1.azure.databricksapps.com/api/stream"
